name: Build FILTERNET APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Cache NDK
      id: cache-ndk
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_HOME }}/ndk
        key: filernet-ndk-${{ runner.os }}-29.0.14206865

    - name: Install NDK
      run: |
        set -uo pipefail
        SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "java: $(java -version 2>&1 | head -1)"
        # 1) Make sure SDK licenses are accepted (harmless if already done)
        yes | "$SM" --licenses > /dev/null 2>&1 || true
        NDK_VER="29.0.14206865"
        # 2) Fast path: NDK already present (e.g. restored from cache)
        if [ -d "$ANDROID_HOME/ndk/$NDK_VER" ] && [ -x "$ANDROID_HOME/ndk/$NDK_VER/ndk-build" ]; then
          echo "NDK $NDK_VER already present (cache hit) - skipping download"
        else
          # 3) Install pinned NDK, up to 3 attempts (transient network retries)
          installed=""
          for attempt in 1 2 3; do
            echo "=== NDK install attempt $attempt of 3 ==="
            if timeout -k 60 1500 "$SM" --install "ndk;$NDK_VER" > sdkmanager.ndk.log 2>&1; then
              installed="yes"
              break
            fi
            echo "=== attempt $attempt failed; last log lines: ==="
            tail -n 15 sdkmanager.ndk.log || true
            sleep 15
          done
          # 4) Fallback: newest available NDK of the same major, then older majors
          if [ -z "$installed" ]; then
            echo "=== pinned NDK not installable; available NDKs: ==="
            "$SM" --list 2>/dev/null | grep -E '^  ndk;' > available-ndks.txt || true
            cat available-ndks.txt || true
            for major in 29 28 27 26; do
              ALT=$(grep -E "^  ndk;${major}\." available-ndks.txt | awk -v skip="ndk;$NDK_VER" '$1 != skip {print $1}' | sort -V | tail -1 || true)
              if [ -n "$ALT" ]; then
                NDK_VER=${ALT#ndk;}
                echo "=== installing fallback NDK: $ALT ==="
                if timeout -k 60 1500 "$SM" --install "$ALT" >> sdkmanager.ndk.log 2>&1; then
                  installed="yes"
                  break
                fi
              fi
            done
          fi
          # 5) Verify the installation actually landed on disk
          if [ -z "$installed" ] || [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            echo "NDK installation failed. Full sdkmanager log:"
            cat sdkmanager.ndk.log || true
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
        fi
        [ -x "$ANDROID_HOME/ndk/$NDK_VER/ndk-build" ] || { echo "ERROR: ndk-build missing in NDK $NDK_VER"; exit 1; }
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
        # 6) Inject ndkVersion into app/build.gradle.kts (idempotent, anchored at compileSdk)
        GRADLE="$GITHUB_WORKSPACE/V2rayNG/app/build.gradle.kts"
        if ! grep -q "ndkVersion" "$GRADLE"; then
          sed -i "/^    compileSdk/i\    ndkVersion = \"$NDK_VER\"" "$GRADLE"
        fi
        echo "=== ndkVersion in build.gradle.kts ==="
        grep -n "ndkVersion" "$GRADLE"

    - name: Save NDK cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ env.ANDROID_HOME }}/ndk
        key: filernet-ndk-${{ runner.os }}-29.0.14206865

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleDebug

    - name: Upload universal APK (main)
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: FILTERNET-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*universal*.apk

    - name: Upload universal APK (F-Droid)
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: FILTERNET-universal-fdroid
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug/*universal*.apk

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: FILTERNET-arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: FILTERNET-armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: FILTERNET-x86_64
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*x86_64*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: FILTERNET-x86
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*x86*.apk
